name: ScrollsSMP
version: 33.0.0
main: me.scrolls.smp.ScrollsPlugin
api-version: '1.21'
commands:
  abilities:
    description: Open the animated Scroll Ability Codex
    usage: /abilities
  words:
    description: Check your Word count
  withdraw:
    description: Withdraw Words as redeemable items
    usage: /withdraw <amount>
    aliases: [withdrawwords]
  scrollwithdraw:
    description: Withdraw Scrolls SMP Words as physical items
    usage: /scrollwithdraw <amount>
  reroll:
    description: Operator reroll for a player
    usage: /reroll <player>
    permission: scrolls.admin
  scrollreroll:
    description: Scrolls SMP admin reroll (avoids command conflicts)
    usage: /scrollreroll <player>
    permission: scrolls.admin
  repair:
    description: Repair held item or all inventory items (OP only)
    usage: /repair [all]
    permission: scrolls.admin
  scrollgive:
    description: Give custom Re-Rollers and Word items (admin only)
    usage: /scrollgive <reroller|words> [amount] [player]
    permission: scrolls.admin
  scroll:
    description: Give and inspect custom scrolls
    usage: /scroll give <player> <sculk|speed|strength|health|frost>
permissions:
  scrolls.admin:
    default: op
