name: ScrollsSMP
version: 8.0.0
main: me.scrolls.smp.ScrollsPlugin
api-version: '1.21'
commands:
  words:
    description: Check your Word count
  withdraw:
    description: Withdraw Words as redeemable items
    usage: /withdraw <amount>
  reroll:
    description: Operator reroll for a player
    usage: /reroll <player>
    permission: scrolls.admin
  scroll:
    description: Give and inspect custom scrolls
    usage: /scroll give <player> <sculk|speed|strength|health|frost>
permissions:
  scrolls.admin:
    default: op
